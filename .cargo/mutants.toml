# Mutants that can't change observable behavior, and why. Everything else must
# be caught by a test.
exclude_re = [
    # Erasing the input reader's buffer when it's dropped: everything it hands
    # out is erased as it's consumed, so at drop only unread input can be left,
    # and the reader is dropped only as the process ends. Freed memory can't be
    # inspected from safe Rust.
    'replace <impl Drop for ErasingReader<R>>::drop with \(\)',
    # Pairing: the "which frame is older" comparison only runs when the two
    # timestamps differ by more than the window, so they are never equal and
    # `<` and `<=` behave the same.
    'src/sync\.rs:.*: replace < with <= in Queues::plan',
    # Adding a key: keys are never removed, so the camera's current key is
    # always provisioned and a new id never equals it; `<` and `<=` behave
    # the same.
    'src/keyring\.rs:.*: replace < with <= in Keyring::with_added',
]
